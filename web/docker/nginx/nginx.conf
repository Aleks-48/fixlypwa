user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Логи без чувствительных данных (NFR: не логировать ПДн). Стандартный combined без тела.
  log_format main '$remote_addr - $status "$request" "$http_referer"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 10m; # фото в заявках (Request.photoUrls) — небольшие

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
