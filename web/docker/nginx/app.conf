# HTTPS-терминация перед Next.js (NFR-050, REQ-062). HTTP → редирект на HTTPS.
# Локально сертификат self-signed (генерится в 40-selfsigned.sh); в проде заменяется
# на Let's Encrypt (см. README, раздел «Продакшн: HTTPS»).

upstream nextjs {
  server app:3000;
}

server {
  listen 80;
  server_name _;

  # ACME challenge для Let's Encrypt (в проде certbot кладёт файлы сюда).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/self.crt;
  ssl_certificate_key /etc/nginx/certs/self.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    proxy_pass http://nextjs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ПЕРЕЗАПИСЫВАЕМ (не $proxy_add_x_forwarded_for): иначе клиент подсовывает свой
    # X-Forwarded-For и обходит per-IP rate-limit OTP (security-review 2026-07-02).
    proxy_set_header X-Forwarded-For $remote_addr;
    # Приложению нужно знать, что снаружи HTTPS (secure cookies сессий, ADR-0005).
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
