  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"8fd1df63-7d73-47c1-9cba-86541c5ebbac\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Golos Text';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"3fc7d23a-d463-42b7-ad60-9b94b4bce2a5\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Golos Text';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"14a222c7-1b3a-4583-8437-40e462c1819b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Golos Text';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d9672efe-edf4-48cf-97cf-2e244daebd89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"ac8e929b-aa13-4790-8f8c-306db749f82d\"><\u002Fscript>\n<style>\n*{box-sizing:border-box}\n:root{--desk:#E8ECF3;--page:#F4F6FA;--surface:#FFFFFF;--surface-2:#EFF2F8;--border:#E5E9F0;--text:#111827;--text-2:#6B7280;--primary:#2E6BF0;--primary-strong:#1E52D6;--primary-soft:#EAF1FE;--success:#12B76A;--success-soft:#E6F7EF;--warn:#C77700;--warn-soft:#FBF0DE;--danger:#E5453A;--danger-soft:#FBE9E7;--shadow:0 30px 60px -34px rgba(16,24,40,.35)}\n[data-theme=\"dark\"]{--desk:#080B12;--page:#0E1320;--surface:#171F2F;--surface-2:#202A3C;--border:#273040;--text:#E9EEF7;--text-2:#93A0B5;--primary:#5B93FF;--primary-strong:#8CB4FF;--primary-soft:rgba(91,147,255,.16);--success:#3DDC97;--success-soft:rgba(61,220,151,.15);--warn:#FBBF5A;--warn-soft:rgba(251,191,90,.16);--danger:#FF7A70;--danger-soft:rgba(255,122,112,.16);--shadow:0 30px 60px -30px rgba(0,0,0,.6)}\n.lucide{width:20px;height:20px;stroke-width:1.75;flex:none}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:3px solid transparent;background-clip:content-box}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-theme=\"{{ theme }}\" style=\"font-family:'Golos Text',system-ui,sans-serif;background:var(--desk);color:var(--text);min-height:100vh;padding:40px 48px 96px;transition:background .25s\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:40px;max-width:1440px\">\n    <div style=\"display:flex;align-items:center;gap:16px\">\n      <div style=\"width:52px;height:52px;border-radius:15px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px var(--primary)\"><i data-lucide=\"building-2\" style=\"width:26px;height:26px\"><\u002Fi><\u002Fdiv>\n      <div>\n        <div style=\"font-size:24px;font-weight:800;letter-spacing:-.02em\">Дом · управление ОСИ<\u002Fdiv>\n        <div style=\"font-size:15px;color:var(--text-2)\">Дизайн-система PWA · голосования, заявки, финансы<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ toggleTheme }}\" style=\"display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;box-shadow:var(--shadow)\">\n      <i data-lucide=\"{{ themeIcon }}\"><\u002Fi>{{ themeLabel }}\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"margin-bottom:64px\">\n    <div style=\"font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin-bottom:22px\">Десктоп · 1440px<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:56px\">\n\n      <!-- ===== LOGIN ===== -->\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700\">Вход<span style=\"font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2);padding:3px 10px;border-radius:999px\">общий<\u002Fspan><\u002Fdiv>\n        <div style=\"width:1440px;height:900px;background:var(--page);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex\">\n          <div style=\"width:46%;background:var(--primary);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center\"><i data-lucide=\"building-2\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fdiv><span style=\"font-size:20px;font-weight:700\">Дом<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-size:44px;line-height:1.12;font-weight:800;letter-spacing:-.02em;margin-bottom:20px;max-width:460px\">Ваш дом под управлением — в одном приложении<\u002Fdiv>\n              <div style=\"font-size:18px;line-height:1.6;opacity:.85;max-width:420px\">Голосования жильцов, заявки на ремонт и прозрачные финансы ОСИ. Для председателя и для жителя.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:flex;align-items:center;gap:12px;font-size:16px\"><i data-lucide=\"check-circle-2\"><\u002Fi>Онлайн-голосования с кворумом<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;font-size:16px\"><i data-lucide=\"check-circle-2\"><\u002Fi>Заявки с фото и статусами<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;font-size:16px\"><i data-lucide=\"check-circle-2\"><\u002Fi>Финансы и должники прозрачно<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:60px\">\n            <div style=\"width:400px\">\n              <div style=\"font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px\">Вход в кабинет<\u002Fdiv>\n              <div style=\"font-size:15px;color:var(--text-2);margin-bottom:32px\">Войдите, чтобы продолжить работу с домом<\u002Fdiv>\n              <label style=\"font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;display:block\">Телефон или email<\u002Flabel>\n              <div style=\"display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:0 14px;margin-bottom:18px\"><i data-lucide=\"user\" style=\"color:var(--text-2)\"><\u002Fi><input placeholder=\"+7 700 000 00 00\" style=\"flex:1;background:none;border:none;outline:none;padding:14px 0;color:var(--text);font:inherit;font-size:15px\"><\u002Fdiv>\n              <label style=\"font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;display:block\">Пароль<\u002Flabel>\n              <div style=\"display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:0 14px;margin-bottom:10px\"><i data-lucide=\"lock\" style=\"color:var(--text-2)\"><\u002Fi><input type=\"password\" value=\"password\" style=\"flex:1;background:none;border:none;outline:none;padding:14px 0;color:var(--text);font:inherit;font-size:15px\"><i data-lucide=\"eye\" style=\"color:var(--text-2);cursor:pointer\"><\u002Fi><\u002Fdiv>\n              <div style=\"text-align:right;margin-bottom:24px\"><a styl
